name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check engram tests
        continue-on-error: false

      - name: Pytest
        run: pytest -v --tb=short

      - name: End-to-end smoke (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash tests/build_fixture.sh /tmp/engram_fixture
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram init
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram index --path /tmp/engram_fixture --force
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram assess "terraform destroy" "datatalks_prod_db" | tee /tmp/assess.out
          grep -q "BLOCK" /tmp/assess.out
          grep -q "production" /tmp/assess.out
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram emit-agents-md --target /tmp/engram_fixture/AGENTS.md
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram check-drift --target /tmp/engram_fixture/AGENTS.md
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram label --apply
          grep -q "engram.io/risk-tier" /tmp/engram_fixture/infra/prod/k8s/payments-deployment.yaml
          ENGRAM_DATA_DIR=/tmp/engram_ci_db engram unlabel --apply
          ! grep -q "engram.io/" /tmp/engram_fixture/infra/prod/k8s/payments-deployment.yaml
