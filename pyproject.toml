[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-devops"
version = "0.2.0"
description = "Local-first DevOps context and blast-radius layer for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Pulkit Verma"}]
keywords = [
    "ai", "mcp", "devops", "platform-engineering",
    "kubernetes", "terraform", "blast-radius", "context-engineering",
    "claude-code", "cursor", "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "sqlite-vec>=0.1.6",
    "mcp>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[project.optional-dependencies]
embed = [
    "fastembed>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/pulkit-verma/engram"
Repository = "https://github.com/pulkit-verma/engram"
Issues = "https://github.com/pulkit-verma/engram/issues"

[project.scripts]
engram = "engram.cli:main"
engram-mcp = "engram.mcp_server:main"

[tool.setuptools.packages.find]
include = ["engram*"]

[tool.setuptools.package-data]
engram = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
